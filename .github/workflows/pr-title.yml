name: pr-title
# Pull requests are squash-merged, so the title becomes the commit subject on main. The branch commits are dropped,
# so only the title is checked, against the format in .cz.toml.
on:
  pull_request:
    # edited reruns the check when the title changes.
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - run: pip install commitizen==4.19.3
      - name: Title follows .cz.toml
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cz check --message "$TITLE"
